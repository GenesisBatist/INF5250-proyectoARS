<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Login Agente</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/source-sans-3@5.0.12/index.css"><link rel="stylesheet" href="../../dist/css/adminlte.css"></head><body class="login-page bg-body-secondary"><div class="login-box"><div class="card card-outline card-success"><div class="card-header text-center"><h3>Acceso Agente ARS</h3></div><div class="card-body"><form id="frmAgente"><div class="mb-3"><label class="form-label">Usuario</label><input class="form-control" name="usuario" value="admin" required></div><div class="mb-3"><label class="form-label">Contraseña</label><input type="password" class="form-control" name="password" value="admin123" required></div><button class="btn btn-success w-100">Ingresar</button><div class="small mt-3">Prueba: admin / admin123</div></form><div class="text-center mt-3"><a href="seleccion-rol.html">Volver</a></div></div></div></div><script src="../../dist/js/auth-rol.js"></script><script>document.getElementById('frmAgente').addEventListener('submit',e=>{e.preventDefault();const r=ARSAuth.loginAgente(e.target.usuario.value,e.target.password.value);if(r.success)location.href='../agente-dashboard.html';else alert(r.message);});</script></body></html>
