<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ARS Salud | Selección de rol</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/source-sans-3@5.0.12/index.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../../dist/css/adminlte.css">
  <style>
    body{background:#e9ecef;font-family:"Source Sans 3",sans-serif}
    .rol-card{border-radius:18px;min-height:190px;color:#fff;box-shadow:0 8px 18px rgba(0,0,0,.15);transition:.25s}
    .rol-card:hover{transform:translateY(-4px)}
    .afiliado{background:#17a2b8}.agente{background:#28a745}.clinica{background:#ff8c00}
  </style>
</head>
<body>
  <div class="container py-5">
    <div class="text-center mb-5">
      <h1 class="display-4">Sistema ARS Salud</h1>
      <p class="lead">Seleccione su tipo de usuario para continuar</p>
    </div>
    <div class="row justify-content-center g-4">
      <div class="col-md-4"><a class="text-decoration-none" href="login-agente.html"><div class="rol-card agente d-flex flex-column justify-content-center align-items-center"><i class="bi bi-briefcase-fill fs-1"></i><h3 class="mt-3">AGENTE ARS</h3><div>Personal Administrativo</div></div></a></div>
      <div class="col-md-4"><a class="text-decoration-none" href="login-afiliado.html"><div class="rol-card afiliado d-flex flex-column justify-content-center align-items-center"><i class="bi bi-person-badge fs-1"></i><h3 class="mt-3">AFILIADO</h3><div>Paciente / Asegurado</div></div></a></div>
      <div class="col-md-4"><a class="text-decoration-none" href="login-clinica.html"><div class="rol-card clinica d-flex flex-column justify-content-center align-items-center"><i class="bi bi-hospital-fill fs-1"></i><h3 class="mt-3">CLÍNICA / HOSPITAL</h3><div>Proveedor médico</div></div></a></div>
    </div>
  </div>
</body>
</html>
